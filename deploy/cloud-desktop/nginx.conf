# Runtime-rendered configuration. Auth applies to HTML AND WebSocket routes.
@FUSION_NGINX_USER@
worker_processes 1;
pid @FUSION_RUN_DIR@/nginx.pid;
error_log @FUSION_ROOT@/logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path @FUSION_RUN_DIR@/client-body;
    proxy_temp_path @FUSION_RUN_DIR@/proxy;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen @FUSION_HTTP_BIND@:@FUSION_HTTP_PORT@;
        server_name _;
        @FUSION_AUTH_DIRECTIVES@
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = / {
            # Internal rewrite retains the server auth gate before HTML delivery.
            rewrite ^ /vnc.html?autoconnect=true&resize=remote&path=websockify last;
        }
        location / {
            proxy_pass http://127.0.0.1:@FUSION_WEBSOCKIFY_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
