; Render with render-config.py; this config never controls pre-existing services.
[supervisord]
nodaemon=true
logfile=@FUSION_ROOT@/logs/supervisor.log
pidfile=@FUSION_RUN_DIR@/supervisord.pid
childlogdir=@FUSION_ROOT@/logs
logfile_maxbytes=20MB
logfile_backups=3

[unix_http_server]
file=@FUSION_RUN_DIR@/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://@FUSION_RUN_DIR@/supervisor.sock

[program:ssh]
command=/usr/sbin/sshd -D -e -f @FUSION_RUN_DIR@/ssh/sshd_config
priority=5
autostart=@FUSION_SSH_AUTOSTART@
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/ssh.log
stderr_logfile=@FUSION_ROOT@/logs/ssh-error.log

[program:vnc]
command=/usr/bin/Xtigervnc @DISPLAY@ -geometry @FUSION_DESKTOP_GEOMETRY@ -depth 24 -rfbport @FUSION_VNC_PORT@ -localhost -SecurityTypes None -AlwaysShared -nolisten tcp -auth @XAUTHORITY@
priority=10
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/vnc.log
stderr_logfile=@FUSION_ROOT@/logs/vnc-error.log

[program:desktop]
command=@FUSION_DEPLOY_DIR@/desktop-session.sh
priority=20
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/desktop.log
stderr_logfile=@FUSION_ROOT@/logs/desktop-error.log

[program:pulse]
command=@FUSION_DEPLOY_DIR@/start-pulse.sh
priority=15
autostart=@FUSION_AUDIO_AUTOSTART@
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/pulse.log
stderr_logfile=@FUSION_ROOT@/logs/pulse-error.log

[program:xpra]
command=@FUSION_DEPLOY_DIR@/start-xpra.sh
priority=35
autostart=@FUSION_AUDIO_AUTOSTART@
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/xpra.log
stderr_logfile=@FUSION_ROOT@/logs/xpra-error.log

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:@FUSION_WEBSOCKIFY_PORT@ 127.0.0.1:@FUSION_VNC_PORT@
priority=30
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/websockify.log
stderr_logfile=@FUSION_ROOT@/logs/websockify-error.log

[program:gateway]
command=/usr/sbin/nginx -c @FUSION_RUN_DIR@/nginx.conf -p @FUSION_RUN_DIR@ -g "daemon off;"
priority=40
autostart=true
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/gateway.log
stderr_logfile=@FUSION_ROOT@/logs/gateway-error.log

[program:fusion]
command=@FUSION_DEPLOY_DIR@/start-app.sh
priority=50
autostart=true
; Never repeat native startup automatically after a crash or a lock refusal.
autorestart=false
startsecs=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=@FUSION_ROOT@/logs/fusion.log
stderr_logfile=@FUSION_ROOT@/logs/fusion-error.log
